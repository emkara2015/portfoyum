name: Daily TEFAŞ Funds Sync

on:
  schedule:
    # GitHub recommends avoiding :00 because scheduled workflows can be delayed
    # during the top-of-hour load spike.  These run at :05/:20/:35/:50 TRT
    # (04:05-08:50 UTC), including four automatic retries after the 11:00 slot.
    - cron: '5,20,35,50 4-8 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

concurrency:
  group: tefas-funds-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run TEFAŞ Sync Script
        run: |
          python scripts/sync_tefas_funds.py
